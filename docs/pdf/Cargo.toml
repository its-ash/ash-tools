[package]
name = "pdf-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-only PDF merge and compression powered by Rust and WebAssembly"

[lib]
crate-type = ["cdylib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = "0.34"
flate2 = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
